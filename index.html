<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="КБЖУ"><meta name="theme-color" content="#0f7a5a">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<title>КБЖУ — дневник питания</title>
<style>
:root{--g:#0f7a5a;--g2:#e3f3ec;--bg:#f2f5f3;--tx:#18221d;--mu:#738078;--P:#3b82f6;--F:#f59e0b;--C:#a855f7;--K:#0f7a5a;--red:#e04848;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:6px}
header .d{flex:1;text-align:center;font-weight:600;font-size:1rem}header button{background:#ffffff22;border:0;color:#fff;border-radius:10px;min-width:36px;height:34px;font-size:1.05rem}
#ver{font-size:.65rem;opacity:.75;position:absolute;right:12px;bottom:1px}
main{padding:10px 10px calc(150px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px #0000000d,0 2px 10px #0000000a}
h2{font-size:1rem;margin:0 0 8px}h3{font-size:.92rem;margin:8px 0 4px}.mu{color:var(--mu);font-size:.82rem}.row{display:flex;gap:8px;align-items:center}.sp{flex:1}
.sum{display:flex;align-items:center;gap:12px}.bars{flex:1;display:grid;gap:7px}.bar{font-size:.8rem}.bar .t{display:flex;justify-content:space-between}
.bar .tr{height:7px;background:#eef1ef;border-radius:5px;overflow:hidden;margin-top:2px}.bar .tr i{display:block;height:100%;border-radius:5px}
.meal{padding:4px 0}.meal .mh{display:flex;align-items:center;gap:6px;font-weight:600;padding:4px 0}.meal .mh .mu{font-weight:400}
.it{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid #f0f2f1}.it .n{flex:1;min-width:0}.it .n div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .k{font-weight:600;white-space:nowrap}.it button{border:0;background:none;font-size:1rem;color:var(--mu);padding:2px 4px}
.btn{border:0;border-radius:12px;padding:10px 14px;font-size:.95rem;background:var(--g);color:#fff;font-weight:600}.btn.s{background:var(--g2);color:var(--g)}.btn.r{background:#fde8e8;color:var(--red)}.btn.sm{padding:6px 10px;font-size:.82rem;border-radius:10px}
.btn.w{width:100%}.add{border:0;background:var(--g2);color:var(--g);border-radius:9px;padding:3px 10px;font-weight:700;margin-left:auto}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid #d7ded9;border-radius:10px;background:#fff;color:var(--tx)}textarea{min-height:92px;resize:vertical}
label{display:block;font-size:.78rem;color:var(--mu);margin:6px 0 2px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fffffff2;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid #e3e8e5;display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;font-size:.7rem;color:var(--mu);padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:1px}nav button b{font-size:1.25rem;font-weight:400}nav button.on{color:var(--g);font-weight:600}
#fab{position:fixed;z-index:7;right:16px;bottom:calc(70px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:1.7rem;box-shadow:0 6px 18px #0f7a5a66}
.sheet{position:fixed;inset:0;z-index:20;background:#0007;display:none;align-items:flex-end;justify-content:center}.sheet.on{display:flex}
.sheet>div{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 12px calc(16px + env(safe-area-inset-bottom))}
.sh{display:flex;align-items:center;margin-bottom:8px}.sh h2{margin:0;flex:1}.x{border:0;background:#e3e8e5;border-radius:50%;width:32px;height:32px;font-size:1rem}
.mic{display:block;margin:6px auto 4px;width:92px;height:92px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:2.4rem;box-shadow:0 6px 20px #0f7a5a55}
.mic.on{background:var(--red);animation:pulse 1.2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 16px #e0484822}}
.hint{background:#fff7e0;border-radius:12px;padding:8px 10px;font-size:.82rem;margin:6px 0}
.pi{background:#fff;border-radius:12px;padding:8px;margin-bottom:6px}.pi .top{display:flex;gap:6px;align-items:center}.pi .nm{flex:1;font-weight:600;border:0;background:none;text-align:left;font-size:.95rem;padding:0;color:var(--tx)}
.pi .bad{color:var(--red)}.pi .ctl{display:grid;grid-template-columns:96px 1fr 30px;gap:6px;align-items:center;margin-top:6px}.pi input,.pi select{padding:6px 8px}
.chip{display:inline-block;border-radius:8px;padding:1px 6px;font-size:.75rem;margin-right:3px}.cP{background:#e6effe;color:#2563eb}.cF{background:#fef3dc;color:#b45309}.cC{background:#f3e8ff;color:#7e22ce}
.seg{display:flex;background:#e3e8e5;border-radius:11px;padding:3px;margin-bottom:10px}.seg button{flex:1;border:0;background:none;padding:7px;border-radius:9px;font-weight:600;color:var(--mu)}.seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 3px #0002}
.adv{display:flex;gap:8px;padding:6px 0;border-top:1px solid #f0f2f1;font-size:.88rem}.adv:first-of-type{border:0}
.res{padding:8px 0;border-top:1px solid #eef1ef;display:flex;gap:8px;align-items:center}.res .n{flex:1}
.kv{display:flex;justify-content:space-between;padding:3px 0;font-size:.9rem}.wt{display:flex;gap:4px;flex-wrap:wrap;align-items:center}.wt i{width:20px;height:26px;border-radius:4px 4px 7px 7px;background:#e3eef8;display:inline-block}.wt i.f{background:#60a5fa}
.empty{text-align:center;color:var(--mu);padding:18px 8px}.tog{display:flex;align-items:center;justify-content:space-between;padding:6px 0}.tog input{width:auto;transform:scale(1.3)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:#18221de6;color:#fff;padding:9px 14px;border-radius:12px;z-index:30;display:none;font-size:.9rem;max-width:90vw}
details.nutri>summary{list-style:none;cursor:pointer}details.nutri>summary::-webkit-details-marker{display:none}.chev{color:var(--mu);transition:transform .15s}details[open] .chev{transform:rotate(90deg)}.score{color:#fff;border-radius:10px;padding:3px 9px;font-weight:700;font-size:.9rem}.swap{color:var(--g);font-weight:600;font-size:.84rem}.plan{margin:0;padding-left:20px;font-size:.88rem}.plan li{margin:3px 0}
video{width:100%;border-radius:12px;background:#000}
/* ===== v1.2 компакт для iPhone 440px ===== */
html,body{font-size:13.5px;line-height:1.3}header{padding:calc(4px + env(safe-area-inset-top)) 8px 4px;gap:4px}header .d{font-size:.95rem}header button{min-width:36px;height:36px;font-size:1rem}#ver{font-size:.58rem;bottom:0}
main{padding:6px 6px calc(120px + env(safe-area-inset-bottom))}.card{padding:8px 10px;margin-bottom:6px;border-radius:12px}h2{font-size:.92rem;margin:0 0 4px}h3{font-size:.84rem;margin:6px 0 2px}.mu{font-size:.76rem}
.sum{gap:10px}.bars{gap:4px}.bar{font-size:.74rem}.bar .tr{height:5px}
.meal{padding:0}.meal .mh{padding:1px 0;font-size:.88rem;min-height:36px}.add{min-width:36px;min-height:32px;padding:0 10px}
.it{padding:5px 0;gap:6px}.it.il{min-height:36px;font-size:.86rem}.it.il .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it.il .mac{font-size:.68rem;color:#8a948e;white-space:nowrap;font-variant-numeric:tabular-nums}.it.il .k{min-width:34px;text-align:right}
.btn{padding:8px 12px;font-size:.88rem;border-radius:10px;min-height:36px}.btn.sm{padding:4px 10px;font-size:.78rem;min-height:36px;min-width:36px}
input,select,textarea{padding:7px 8px;font-size:16px;border-radius:9px}textarea{min-height:64px}label{font-size:.72rem;margin:4px 0 1px}
nav{padding:2px 2px calc(2px + env(safe-area-inset-bottom))}nav button{font-size:.62rem;padding:2px 0;min-height:40px}nav button b{font-size:1.05rem}
#fab{width:54px;height:54px;font-size:1.4rem;right:12px;bottom:calc(54px + env(safe-area-inset-bottom))}
.wrow{gap:6px;align-items:center}.wrow .wt i{width:11px;height:16px}.wt{gap:2px}
details.col>summary{list-style:none;cursor:pointer;min-height:36px}details.col>summary::-webkit-details-marker{display:none}details.col>summary h2{margin:0}details[open].col .chev{transform:rotate(90deg)}
.adv{padding:4px 0;font-size:.82rem}.kv{font-size:.82rem;padding:2px 0}.chip{font-size:.68rem;padding:0 4px}.seg{margin-bottom:6px}.seg button{padding:6px;min-height:36px}
.mic{width:72px;height:72px;font-size:1.9rem;margin:2px auto}.hint{padding:6px 8px;font-size:.76rem;margin:4px 0}.sheet>div{padding:10px 10px calc(12px + env(safe-area-inset-bottom))}.sh{margin-bottom:4px}
.pi{padding:6px 8px;margin-bottom:4px}.pi .nm{font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:30px}.pi .ctl{grid-template-columns:92px 1fr 36px;margin-top:3px;gap:4px}.pi .mu{margin-top:2px!important}.x{width:36px;height:36px}
.score{font-size:.8rem;padding:2px 7px}.plan{font-size:.8rem}.swap{font-size:.78rem}.res{padding:6px 0}
.mr{display:grid;grid-template-columns:118px 1fr 74px 38px;gap:6px;align-items:center;min-height:30px;font-size:.8rem;border-top:1px solid #f2f4f3;cursor:pointer}.mr .mn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr .mb{height:6px;background:#eef1ef;border-radius:4px;overflow:hidden}.mr .mb i{display:block;height:100%;background:var(--g);border-radius:4px}.mr .ma{text-align:right;color:var(--mu);font-size:.74rem;white-space:nowrap}.mr .mp{text-align:right;font-weight:600}
.mr.low .mb i{background:var(--F)}.mr.low .mp{color:#b45309}.mr.over .mb i{background:var(--red)}.mr.over .mp{color:var(--red)}.cR{background:#fde8e8;color:var(--red)}
</style></head><body>
<header><button id="prev" aria-label="Предыдущий день">‹</button><div class="d" id="dlabel"></div><button id="next" aria-label="Следующий день">›</button><button id="say" title="Озвучить">🔊</button><span id="ver"></span></header>
<main id="app"></main>
<button id="fab" aria-label="Сказать, что съел">🎙️</button>
<nav id="nav"></nav>
<div class="sheet" id="sheet"><div id="sbody"></div></div>
<div class="sheet" id="sheet2"><div id="sbody2"></div></div>
<div id="toast"></div>
<script src="db.js"></script><script src="micro.js"></script><script src="micros.js"></script><script src="parser.js"></script><script src="nutri.js"></script><script src="app.js"></script>
</body></html>
